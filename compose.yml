services:
  ecommerce_node_server:
    image: node:26-alpine
    container_name: ecommerce_server
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    volumes:
      - ./:/app
    env_file:
      - .env
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    command: sh -c "tail -f /dev/null"
    networks:
      - ecommerce_net
    depends_on:
      ecommerce_mongodb_server:
        condition: service_healthy

  ecommerce_mongodb_server:
    image: mongo:latest
    container_name: ecommerce_db
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: blue
      MONGO_INITDB_ROOT_PASSWORD: adminfjsl90vvv
    volumes:
      - mongodb_data:/data/db
      - ./mongo/mongodb-keyfile:/etc/mongo-keyfile:ro,Z
      # This script runs automatically exactly once during first boot to configure the replica set
      - ./mongo/init-rs.js:/docker-entrypoint-initdb.d/init-rs.js:ro
    command: "mongod --replSet rs0 --bind_ip_all --keyFile /etc/mongo-keyfile"
    networks:
      - ecommerce_net
    healthcheck:
      test: mongosh --port 27017 --quiet --eval "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ecommerce_redis_server:
    image: redis:7-alpine
    container_name: ecommerce_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ecommerce_redis_db_2708
    volumes:
      - redis_data:/data
    networks:
      - ecommerce_net

volumes:
  mongodb_data:
  redis_data:

networks:
  ecommerce_net:
    driver: bridge
